<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Arcade</title>
	<meta name="description" content="A small arcade of browser games.">
	<meta name="color-scheme" content="light dark">
	<link rel="stylesheet" href="hub.css">
</head>
<body>
	<header class="hub-head">
		<h1 id="hub-title">Arcade</h1>
		<p id="hub-sub"></p>
		<div class="hub-tools">
			<input id="hub-search" type="search" placeholder="Search games" aria-label="Search games">
			<div id="hub-tags" class="hub-tags" role="group" aria-label="Filter by tag"></div>
		</div>
	</header>
	<main>
		<ul id="hub-grid" class="hub-grid" aria-live="polite"></ul>
		<p id="hub-empty" class="hub-empty" hidden>No games match that.</p>
	</main>
	<noscript><p class="hub-empty">The arcade needs JavaScript to list its games. <a href="beberd/">Beberd</a> · <a href="pixel-run/">Pixel Run</a></p></noscript>
	<script src="hub.js"></script>
</body>
</html>
