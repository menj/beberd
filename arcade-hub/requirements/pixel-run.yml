# Requirements: make Pixel Run work together with Beberd in one arcade.
#
# Audience : a developer (or Claude session) working in the menj/pixel-run repository.
# Written   : 2026-10-05, against pixel-run main @ da3b06d and beberd master @ e31d0be (+ the
#             "shared arcade stats" change in this branch).
# Status key: done = already true in Pixel Run | todo = work for Pixel Run | optional = nice to have.
# Nothing here needs a shared server, shared database or player accounts (see non_goals).

schema: 1
title: Pixel Run <-> Beberd arcade compatibility
hosting:
  hub: "       https://menj.buzz/arcade/            # static page: arcade-hub/ in the beberd repo"
  beberd:     https://menj.buzz/arcade/beberd/
  pixel_run:  https://menj.buzz/arcade/pixel-run/
  isolation:  Each game has its own folder, database (or SQLite file), cookie path and service-worker scope.

# --------------------------------------------------------------------------------------------
# What is already compatible (verified by reading both repos; do not redo)
# --------------------------------------------------------------------------------------------
already_compatible:
  - id: C1
    what: Hub contract (game.json schema 1) incl. summary, badges, thumbnail, icon, shareImage
    where: [pixel-run/game.json, beberd/game.json]
  - id: C2
    what: Relative URLs plus a <base> tag, so /arcade/<game> works with or without a trailing slash
  - id: C3
    what: "Back-link to the arcade (arcade_url / arcadeUrl) and public_url for share previews"
  - id: C4
    what: Shared stats record in localStorage under "arcade.stats" (shape below), written after each non-cheated run
  - id: C5
    what: Same IDDQD admin cheat, gated by the server session; cheated runs are never recorded
  - id: C6
    what: Same three database engines (MySQL/MariaDB, PostgreSQL, SQLite) and a web installer
  - id: C7
    what: Fixed 60 Hz simulation (STEP_MS) and the SAME seed algorithms (mulberry32 + hashSeed), so a PHP port can be shared
  - id: C8
    what: No key or cookie collisions on one domain
    storage_prefixes: { pixel_run: ["pixel_run_*", "pixelrun_admin (cookie)"], beberd: ["fb_*", "fb_session (cookie)"], shared: ["arcade.stats", "arcade_name"] }

# --------------------------------------------------------------------------------------------
# Shared conventions (the contract both games follow)
# --------------------------------------------------------------------------------------------
conventions:
  arcade_stats:
    key: arcade.stats
    storage: localStorage
    shape: |
      { "<game id>": { "best": <int>, "plays": <int>, "last": <int>, "lastPlayed": <epoch ms> } }
    rules:
      - Write only your own game id ("pixel-run", "beberd"); never modify another game's entry.
      - Never record god-mode (cheat) runs.
      - Assisted/easy-mode runs may count as a play but must not set "best".
      - "Wrap storage in try/catch; the hub shows \"Your best: N\" from this record."
  arcade_name:
    key: arcade_name
    storage: localStorage
    meaning: The player's display name, shared by every game that asks for one.
    read_order_for_pixel_run: [arcade_name, pixel_run_name]
    write: [arcade_name, pixel_run_name]      # keep the old key so nothing regresses
    note: Beberd already reads arcade_name, then fb_name, then pixel_run_name.
  game_json_required_for_hub: [schema, id, title, tagline, url, thumbnail]
  game_json_used_by_hub_cards: [title, tagline, summary, badges, tags, features, thumbnail]
  game_id_equals_arcade_stats_key: true

# --------------------------------------------------------------------------------------------
# Requirements for Pixel Run
# --------------------------------------------------------------------------------------------
requirements:

  - id: PR-1
    title: Shared player name (arcade_name)
    priority: must
    effort: S
    status: todo
    why: A player who enters a name once should not retype it in every game. Beberd already prefills from Pixel Run's name; this closes the loop.
    change:
      - Where NAME_KEY ('pixel_run_name') is read, read arcade_name first and fall back to pixel_run_name.
      - Where the name is saved, write both arcade_name and pixel_run_name.
    touches: [assets/js/game.js (NAME_KEY, ~line 42 and ~1506)]
    acceptance:
      - "Save a name in Beberd, open Pixel Run in the same browser: the name field is prefilled."
      - "Save a name in Pixel Run, open Beberd: prefilled."
      - A browser that only has pixel_run_name (an existing player) still sees their name.
    reference: beberd/js/game.js (saveFormInto)

  - id: PR-2
    title: 'A "More games" link on the game-over card'
    priority: should
    effort: S
    status: todo
    why: Pixel Run already shows a "‹ ARCADE" back link; players are most receptive right after a run, so link to the hub there too.
    change:
      - When arcadeUrl is set, add a low-emphasis "More games ›" link under the game-over buttons.
      - Hide it when arcadeUrl is empty (standalone, or not hosted in a hub).
    touches: [assets/js/game.js, assets/css/style.css]
    acceptance:
      - "With arcade_url set: link present and points at it. Without: absent."
    reference: beberd/js/game.js ("More games")

  - id: PR-3
    title: Truthful "offline-play" claim (add a service worker, or drop the feature flag)
    priority: should
    effort: S-M
    status: todo
    finding: game.json lists the feature "offline-play" and there is a web manifest, but no service worker exists anywhere in the repo.
    options:
      - Add sw.js (network-first pages, stale-while-revalidate assets; never cache api/, admin.php, install.php) and register it. Bump a VERSION constant on releases.
      - Or remove "offline-play" from features/badges until a service worker exists (standalone.html opened from disk still works offline).
    touches: [new sw.js, index.php (register), game.json]
    acceptance:
      - After one online visit, airplane mode still loads and plays the game.
      - Leaderboard and admin calls are never served from cache.
    reference: beberd/sw.js, beberd/js/pwa.js

  - id: PR-4
    title: Server-verified scores (replay verification)
    priority: should
    effort: L
    status: todo
    why: >
      Today the server only checks that score <= duration_ms/1000*25 + 50, and duration_ms is supplied by the client,
      so a forged payload with a long duration passes. Verified replays remove this whole class of cheating.
    already_in_place:
      - Fixed 60 Hz tick simulation (update() once per STEP_MS).
      - Seeded RNG for the daily course (rnd = mulberry32(hashSeed(...))).
      - Game logic does not read the wall clock (Date.now only feeds duration_ms and lastPlayed).
    needed:
      - "Seed every run, not just the daily: for normal runs set rnd = mulberry32(randomSeed) and send the seed. Every course decision must come from rnd() (particles/scenery may keep Math.random)."
      - "Record inputs against the tick counter: jump press, jump release, duck on, duck off. Jump height depends on hold time, so releases matter."
      - "Port update() to PHP (includes/replay.php): spawning, physics, collisions, character traits (glide, starting shield), bombs, shields, speed ramp. Keep a header comment \"keep in sync with assets/js/game.js\"."
      - Submit a replay {v, seed, mode, character, challenge, ticks, inputs:[[deltaTicks, code], ...], score}; the server re-plays and uses ITS score; reject on mismatch.
      - Reject old clients (no replay) with a "please reload" message.
      - Caps: max ticks (e.g. 10 min = 36000), max inputs, human input-rate limit, seed/day rules for the daily course (seed must equal hashSeed of the UTC date, and the date must be today or yesterday).
    parity_porting_notes:
      - mulberry32/hashSeed use 32-bit math (Math.imul, >>>). PHP ints are 64-bit; reuse beberd's helpers fbr_i32(), fbr_imul(), fbr_seed_from() verbatim (identical algorithm).
      - Mirror the ORDER of operations in update() exactly, including loop direction when removing items.
      - Use only IEEE-754 doubles; avoid any logic that depends on rendering or real time.
    touches: [assets/js/game.js, new includes/replay.php, api/submit-score.php, includes/scores.php, sql/ (store replay-derived fields only if needed)]
    acceptance:
      - "Parity harness: play >= 400 real runs in a headless browser (fast-stepping, varied autopilots, every character, normal + daily); PHP replay matches score and tick count on 100% (0 mismatches)."
      - "Tamper tests all rejected: edited score, swapped seed, shifted/removed/added input, wrong character, impossible input rate, huge ticks, malformed JSON, daily run with wrong day or seed."
      - Honest run saved through the real UI; leaderboard shows it; cheated (god-mode) runs can never be submitted.
      - Verification costs a few milliseconds per run.
    honest_limits:
      - A bot that plays a real, legal run still verifies. Seed-hunting on normal runs is possible; the daily course is immune because its seed is the date.
    reference: [beberd/includes/replay.php, beberd/js/game.js (die(), stepNo, flaps), beberd/api.php, parity harness described in beberd/README.md "Verified scores"]

  - id: PR-5
    title: Gamepad support
    priority: optional
    effort: S
    status: todo
    why: game.json currently says input.gamepad = false. Beberd supports gamepads; matching it makes the arcade consistent.
    change:
      - Poll navigator.getGamepads() each frame; edge-triggered. A/B/D-pad up = jump (hold = hold), D-pad down/X = duck, Start = pause, Back = mute.
      - Set input.gamepad = true in game.json.
    acceptance: [Fake a gamepad in a test and check press/hold/release map to jumpPress/jumpRelease, Holding a button does not retrigger]
    reference: beberd/js/game.js (pollPad)

  - id: PR-6
    title: Ghost replays and Rematch
    priority: optional
    effort: M
    status: todo
    depends_on: [PR-4]      # the seeded normal runs from PR-4 are what make a rematch possible
    why: Racing your best run is a strong retention loop. Works automatically for the daily course (same seed for everyone).
    change:
      - "Record the runner's y (or tick state) every 2 ticks; keep the best run per course (daily: per date; normal: the last best run's seed)."
      - Draw a translucent "BEST" runner; add a Rematch button that replays that seed with the ghost.
      - Never create ghosts from god-mode runs.
    acceptance: [Ghost appears in the next daily run, Worse runs never replace it, Rematch reproduces the same obstacle sequence]
    reference: beberd/js/game.js (saveGhost, drawGhost, rematch)

  - id: PR-7
    title: Dynamic share card
    priority: optional
    effort: S-M
    status: todo
    why: Pixel Run has a static share image; a per-result picture (hero, score, joke) gets shared far more.
    change:
      - Render a 1080x1350 canvas with the hero's current face, score, daily date or mode, the joke and the game URL; use navigator.share({files}) where supported, else download the PNG and copy the text.
    acceptance: [Valid PNG at 1080x1350, Native share receives the file and text, Desktop fallback downloads beberd-score-style file, Not offered for god-mode runs]
    reference: beberd/js/game.js (renderShareCard, shareResult)

  - id: PR-8
    title: Accessibility parity
    priority: optional
    effort: S-M
    status: todo
    items:
      - "High-contrast colour mode, also used automatically for prefers-contrast: more."
      - Assist mode (wider gaps / slower), clearly marked, never counting toward best scores, medals, the leaderboard or the daily course.
      - Haptics on supporting phones with an off switch, never used when prefers-reduced-motion is set.
    reference: beberd/README.md "Accessibility and input"

  - id: PR-9
    title: Keep the hub contract in sync
    priority: must
    effort: S
    status: todo
    change:
      - Keep game.json version equal to includes/config.php version.
      - After PR-3/PR-4/PR-5 land, update features/badges/input flags in game.json to match reality.
    acceptance: [The arcade hub shows the up-to-date card, No feature is advertised that does not exist]

# --------------------------------------------------------------------------------------------
# What Beberd does on its side (so Pixel Run does not have to)
# --------------------------------------------------------------------------------------------
beberd_side:
  done:
    - Writes arcade.stats["beberd"] after each non-cheated run (assisted runs count a play only).
    - Reads arcade_name, then fb_name, then pixel_run_name for the score-form name.
    - game.json carries summary, badges and tags; the hub shows badges and "Your best" from arcade.stats.
    - arcade-hub/ lists any game named in games.json by reading its game.json.
  planned_if_wanted:
    - A shared "arcade profile" page in the hub (name, bests across games) read from localStorage only.

# --------------------------------------------------------------------------------------------
# Suggested order and definition of done
# --------------------------------------------------------------------------------------------
suggested_order:
  - { step: 1, items: [PR-1, PR-2, PR-9], note: Small, safe, visible straight away. }
  - { step: 2, items: [PR-3], note: Fix the offline claim one way or the other. }
  - { step: 3, items: [PR-4], note: Biggest piece; do it behind the parity harness. }
  - { step: 4, items: [PR-5, PR-6, PR-7, PR-8], note: Optional polish, any order; PR-6 needs PR-4's seeded runs. }

definition_of_done:
  - Both games open from the hub, each with its own thumbnail, badges and "Your best".
  - Name entered in one game prefills in the other.
  - No localStorage key or cookie collisions (prefixes above).
  - Each game works with no database, with each of the three database engines, and from its standalone page where applicable.
  - "Hub test passes: tiles, search/tag filters, links, back-link, share previews, storage and cookie isolation."

non_goals:
  - A shared leaderboard, shared database or cross-game accounts.
  - Server-to-server calls between the games.
  - Moving either game's code into the other.

risks:
  - "Replay verification (PR-4) fails open to \"reject\" on any logic drift: change update() in JS and PHP together, and re-run the parity harness on every physics change."
  - "localStorage is per browser: stats, ghosts and names do not follow a player across devices."

